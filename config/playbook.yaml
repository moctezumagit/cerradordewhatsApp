# Playbook del Cerrador de WhatsApp
# Negocio: Programa de red de Asociados / Consultores Independientes
# Mentora: María de Jesús Vera (+52 244 123 5715)
# Industria: Bienestar digital y biotecnología celular (45+ años de ciencia, patentes médicas)
# Modelo: Logística y envíos 100% automatizados (sin inventario en casa ni cobrar fiado)

playbook:
  negocio: "Red de Asociados Independientes en Biotecnología y Bienestar Celular"
  mentora: "María de Jesús Vera"
  contacto_oficial: "+52 244 123 5715"
  enlace_whatsapp: "https://wa.me/522441235715"
  paises: ["México", "Colombia", "Perú", "Ecuador"]

  tono: |
    Tratamiento siempre de TÚ.
    Tono cercano, respetuoso, profesional, empático, consultivo y de RECONOCIMIENTO.
    Frase firma: «Te felicito por abrirte a escuchar» / «Te felicito por abrirte al cambio de mentalidad».
    Valida primero la experiencia previa de la persona (si ya vende por catálogo, tiene negocio, spa o contactos); nunca tratarla como principiante.
    Estilo de mensajes cortos tipo WhatsApp (2 a 3 líneas por mensaje), sin presionar y sin perseguir.
    Postura de liderazgo: no busca convencer a todos, evalúa actitud y compromiso.
    REGLA CRÍTICA: NUNCA dar cifras de ganancias, promesas de ingresos ni inventar precios. La activación es con una caja de producto cuyos detalles exactos se presentan de forma transparente en la llamada de orientación de 15 minutos con María de Jesús Vera.

  objeciones:
    - objecion: "¿Es pirámide / es estafa?"
      respuesta: >
        Te entiendo perfecto la duda, es natural cuidar el tiempo y el patrimonio. Te felicito por abrirte a escuchar con criterio.

        Esta es una red de mercadeo formal respaldada por una empresa internacional con más de 45 años de ciencia, patentes médicas e investigación clínica, y producto físico de consumo recurrente con logística automatizada.

        La explicación completa del modelo y sus reglas de operación te las presenta María en la llamada de orientación de 15 minutos. ¿Te gustaría coordinar ese espacio?

    - objecion: "¿Cuánto se gana?"
      respuesta: >
        Es una pregunta muy válida cuando se emprende. Las comisiones dependen directamente de la productividad y del crecimiento del equipo, por lo que no prometemos cifras mágicas ni garantías fijas sin conocer tu dedicación.

        Lo que sí te aseguramos es el sistema paso a paso, las capacitaciones y la mentoría 1 a 1 para que logres resultados sostenibles. En la llamada de orientación María te muestra el plan oficial y cómo proyectar tus metas.

        ¿Qué día te viene mejor para platicar 15 minutos con ella?

    - objecion: "¿Cuánto cuesta entrar?"
      respuesta: >
        La activación al negocio se realiza mediante un paquete de producto inicial (una caja de producto), con logística y envíos directos de fábrica.

        El monto exacto y las promociones vigentes varían según tu país (México, Colombia, Perú o Ecuador) y se confirman con total transparencia en la llamada de orientación personalizada.

        ¿Desde qué país nos escribes para tener a la mano los detalles correspondientes?

    - objecion: "Ya estoy en otra compañía / ya vendo otra cosa"
      respuesta: >
        ¡Te felicito por esa trayectoria! Las personas con experiencia comercial y visión como tú son justo el perfil ideal para este equipo.

        No se te pide en ningún momento dejar lo que ya haces (tu empleo, ventas por catálogo, negocio o red actual); la propuesta está diseñada para sumar en paralelo de forma apalancada.

        ¿Te gustaría conocer en 15 minutos cómo compaginar ambos proyectos?

    - objecion: "Ya lo intenté y me dejaron solo"
      respuesta: >
        Te comprendo totalmente. El problema en esos casos no fue el modelo de negocio, sino el abandono del equipo.

        Aquí la diferencia fundamental es que cuentas con un sistema probado, capacitación remota y acompañamiento real 1 a 1 de la mano de María de Jesús Vera desde tu primer día.

        ¿Te gustaría agendar una breve llamada para que conozcas la metodología de trabajo?

    - objecion: "No tengo tiempo / No puedo dejar mi trabajo o negocio actual"
      respuesta: >
        Tiene todo el sentido. Precisamente este modelo está diseñado para construirse a tiempo parcial (de 10 a 12 horas por semana), en paralelo a tu ocupación actual sin descuidar tus ingresos principales.

        Con el sistema de envíos automatizados no inviertes tiempo en repartos ni cobranza.

        ¿En qué horario sueles tener un espacio más despejado para una llamada de 15 minutos?

    - objecion: "No me gusta vender al menudeo, cobrar ni andar persiguiendo gente"
      respuesta: >
        Te entiendo al 100%. Nosotros no trabajamos con venta directa tradicional, ni cobramos fiado, ni perseguimos amigos o familiares.

        La compañía se encarga de toda la logística de envíos directos de fábrica y facturación al cliente. Tu enfoque como socio es liderar, duplicar y construir equipo con prospección profesional.

        ¿Te parece si revisamos esta dinámica en una llamada breve con María?

    - objecion: "Ya estuve en una red / No sé cómo empezar"
      respuesta: >
        Valoro mucho que ya tengas noción de la industria; esa experiencia previa es una ventaja enorme para ti.

        Para arrancar no estás solo: tenemos un mapa paso a paso y la mentoría directa 1 a 1 con María de Jesús Vera para enseñarte a prospectar sin perseguir y con herramientas digitales.

        ¿Te gustaría agendar 15 minutos para ver si este sistema hace sentido con lo que buscas?

    - objecion: "Envíame toda la información por PDF o video antes de hablar"
      respuesta: >
        Con gusto te compartimos material; sin embargo, cuidamos mucho el tiempo de ambos y la propuesta se personaliza según tu disponibilidad, experiencia y país.

        Por eso, la llamada de orientación de 15 minutos con María es el espacio más productivo para resolver dudas específicas y ver si hay encaje mutuo.

        ¿Prefieres mañana por la mañana o por la tarde?

    - objecion: "Tengo producto/inventario detenido en casa"
      respuesta: >
        Esa es una de las grandes razones por las que muchos socios se unieron a nosotros: nuestro modelo funciona con envíos directos de fábrica al domicilio del cliente.

        No requieres acumular stock, no necesitas bodegas en casa ni te arriesgas a que se te quede producto detenido.

        ¿Te gustaría platicar 15 minutos con María para conocer cómo opera esta logística?

